<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOP- Project: Weather App</title>
  </head>
  <body background="./assets/images/backgroundImg.jpg">
    <div class="bannerDiv">
      <header>Luma</header>
      <div class="bannerDivRight">
        <input class="searchInput" placeholder="Search"></input>
        <button class="searchButton">Go</button>
      </div>
    </div>
    <div class="weatherData"></div>
    <div class="main-weather-display-info">
      <div class="generalInfo">
        <p class="condition">Sunny</p>
        <h1 class="location">London, United Kingdom</h1>
        <span class="degrees">20C</span>
      </div>
    </div>
  </body>
</html>
